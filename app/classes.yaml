# Detector class names and display colors used by app.py.
#
# app.py reads class names from the metadata embedded in models/best.onnx
# first, so labels always match the loaded weights. The `names` list below is
# only a fallback for models exported without that metadata — if you use it,
# its order MUST match the class index order in the training notebook's
# data.yaml.
names:
  - BJT-NPN
  - BJT-PNP
  - Capacitor
  - Diode
  - GND
  - I-AC
  - I-DC
  - Inductor
  - MOSFET-N
  - MOSFET-P
  - Op-Amp
  - Resistor
  - V-AC
  - V-DC
  - V-DC (one port)
  - Wire Crossover
  - Zener Diode

# RGB colors used to draw each class's bounding box / label. Any class not
# listed here falls back to DEFAULT_COLOR in app.py.
colors:
  Resistor: [0, 102, 255]
  Capacitor: [220, 20, 60]
  Diode: [255, 140, 0]
  GND: [0, 153, 76]
  Op-Amp: [138, 43, 226]
  Inductor: [255, 20, 147]
  BJT-NPN: [0, 206, 209]
  BJT-PNP: [255, 215, 0]
  MOSFET-N: [75, 0, 130]
  MOSFET-P: [128, 0, 128]
  V-AC: [46, 139, 87]
  V-DC: [255, 99, 71]
  V-DC (one port): [219, 112, 147]
  I-AC: [0, 191, 255]
  I-DC: [218, 165, 32]
  Wire Crossover: [105, 105, 105]
  Zener Diode: [255, 69, 0]
